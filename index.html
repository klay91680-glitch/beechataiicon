<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee App Icons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            gap: 30px;
        }

        .icon-container {
            width: 150px;
            height: 150px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            background-color: #fff;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- ပထမပုံ (Chat Bee) -->
    <div class="icon-container">
        <img src="https://i.ibb.co/vz9G5sV/chat-bee.jpg" alt="Chat Bee">
    </div>

    <!-- ဒုတိယပုံ (Bee AI) -->
    <div class="icon-container">
        <img src="https://i.ibb.co/0jZ4R8R/bee-ai.jpg" alt="Bee AI">
    </div>

</body>
</html>
